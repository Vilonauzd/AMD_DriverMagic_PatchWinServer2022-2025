name: Rebuild TurtleAMD gallery assets

on:
  push:
    paths:
      - '.image-upload-ready'

permissions:
  contents: write

jobs:
  rebuild-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct high-quality gallery images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/screenshots/native-qa3-v2
          for image in native-sidecar-gallery-v2.webp native-workflow-gallery-v2.webp native-amd-handoff-gallery-v2.webp native-installer-gallery-v2.webp; do
            cat ".image-upload/${image}.part"* > "/tmp/${image}.b64"
            base64 --decode "/tmp/${image}.b64" > "assets/screenshots/native-qa3-v2/${image}"
            test -s "assets/screenshots/native-qa3-v2/${image}"
          done
          sed -i 's#assets/screenshots/native-qa3/native-sidecar-gallery.jpg#assets/screenshots/native-qa3-v2/native-sidecar-gallery-v2.webp#g; s#assets/screenshots/native-qa3/native-workflow-gallery.jpg#assets/screenshots/native-qa3-v2/native-workflow-gallery-v2.webp#g; s#assets/screenshots/native-qa3/native-amd-handoff-gallery.jpg#assets/screenshots/native-qa3-v2/native-amd-handoff-gallery-v2.webp#g; s#assets/screenshots/native-qa3/native-installer-gallery.jpg#assets/screenshots/native-qa3-v2/native-installer-gallery-v2.webp#g' README.md
          sed -i 's#../assets/screenshots/native-qa3/native-sidecar-gallery.jpg#../assets/screenshots/native-qa3-v2/native-sidecar-gallery-v2.webp#g; s#../assets/screenshots/native-qa3/native-workflow-gallery.jpg#../assets/screenshots/native-qa3-v2/native-workflow-gallery-v2.webp#g; s#../assets/screenshots/native-qa3/native-amd-handoff-gallery.jpg#../assets/screenshots/native-qa3-v2/native-amd-handoff-gallery-v2.webp#g; s#../assets/screenshots/native-qa3/native-installer-gallery.jpg#../assets/screenshots/native-qa3-v2/native-installer-gallery-v2.webp#g' docs/GALLERY.md
          rm -rf .image-upload .image-upload-ready
          rm -f assets/screenshots/native-qa3-v2/_probe.txt
      - name: Commit rebuilt gallery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TurtleAMD Gallery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Replace gallery with high-quality v2 images'
          git push
